[project]
name = "ai-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hank X", email = "hank@momane.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "openai>=3.42.0",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
]

[project.scripts]
ai-agent = "ai_agent:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle 错误
    "F",    # pyflakes
    "I",    # isort 导入排序
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "BLE",  # flake8-blind-except
    "SIM",  # flake8-simplify
    "RUF",  # ruff 专属规则
]
ignore = [
    # 课程代码里有中文注释和长行，E501（行宽）交给 formatter 处理
    "E501",
    # RUF001/002/003：中文项目正常用全角标点，这些规则是误报
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# 测试脚本需要捕获 BaseException 来保证测试运行器本身不中断
"day3/test_retry.py" = ["BLE001"]
"day3/test_self_healing_e2e.py" = ["BLE001"]
"day4/test_planner.py" = ["BLE001"]
# self_healing.py 的工具执行层故意捕获宽异常，把失败转成模型可读信息
"day3/self_healing.py" = ["BLE001"]
